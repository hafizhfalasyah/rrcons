[PHP]
memory_limit = 256M
; Video Social Media boleh sampai 50 MB (validasi max:51200), jadi batas PHP harus di atasnya
upload_max_filesize = 64M
post_max_size = 72M
max_execution_time = 300
max_input_time = 300
date.timezone = UTC
default_charset = UTF-8
expose_php = Off

; Local development diagnostics. Laravel APP_DEBUG remains the application-level control.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

[Session]
session.use_strict_mode = 1

[OPcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
